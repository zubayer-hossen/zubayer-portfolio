# Netlify: deploy the /client folder. Replace YOUR-BACKEND with your Render/Railway URL.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR-BACKEND.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/og/*"
  to = "https://YOUR-BACKEND.onrender.com/og/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://YOUR-BACKEND.onrender.com/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "https://YOUR-BACKEND.onrender.com/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
